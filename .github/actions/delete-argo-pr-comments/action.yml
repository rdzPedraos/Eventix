name: Delete Argo PR comments
description: Removes pull request comments posted by the Argo CD notifications bot.

inputs:
  bot-login:
    description: GitHub login of the bot whose comments should be removed
    required: false
    default: despliegaloargocd[bot]

runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        BOT_LOGIN: ${{ inputs.bot-login }}
      with:
        script: |
          const pr = context.issue.number;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr,
            per_page: 100,
          });

          comments.filter((comment) => comment.user?.login !== process.env.BOT_LOGIN)
            .forEach(async (comment) => {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            });
