name: Preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  contents: read
  statuses: write

env:
  PREVIEW_LABEL: preview-ready

jobs:
  reset-pr-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reset PR state
        uses: actions/github-script@v8
        env:
          PREVIEW_LABEL: ${{ env.PREVIEW_LABEL }}
        with:
          script: |
            const pr = context.issue.number;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                name: process.env.PREVIEW_LABEL,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Delete Argo PR comments
        uses: ./.github/actions/delete-argo-pr-comments

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: js-changes
        with:
          filters: |
            resources:
              - 'resources/**'
              - 'package.json'
              - 'package-lock.json'
              - 'public/**'
              - 'eslint.config.js'
              - 'vite.config.js'
              - 'tailwind.config.mjs'
              - 'postcss.config.js'
              - 'tsconfig.json'

      - if: steps.js-changes.outputs.resources != 'true'
        run: echo "Sin cambios en resources/; se omiten audit y lint de JS."

      - if: steps.js-changes.outputs.resources == 'true'
        uses: ./.github/actions/validate-javascript

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, gd
          coverage: none
          cache: composer
          cache-dependency-path: composer.lock

      - name: Audit PHP dependencies (Composer)
        run: composer security:audit

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP (Pint)
        run: composer lint

      - name: Run unit tests (PHPUnit)
        run: composer test:unit

  build-and-push:
    needs: [reset-pr-state, javascript, php]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-and-push-image
        with:
          tag: ${{ github.event.pull_request.head.sha }}
          docker-username: ${{ secrets.DOCKERHUB_USERNAME }}
          docker-password: ${{ secrets.DOCKERHUB_TOKEN }}

  signal-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready to generate preview
        uses: actions/github-script@v8
        env:
          PREVIEW_LABEL: ${{ env.PREVIEW_LABEL }}
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "pending",
              context: "argo/preview",
              description: "Despliegue de aplicación en construcción…",
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [process.env.PREVIEW_LABEL],
            });
