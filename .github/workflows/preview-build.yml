name: Preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

env:
  PREVIEW_LABEL: preview-ready

jobs:
  unlabel-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview-ready label
        uses: actions/github-script@v8
        env:
          PREVIEW_LABEL: ${{ env.PREVIEW_LABEL }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: process.env.PREVIEW_LABEL,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Delete preview comments
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "argocd-notifications preview/eventix";

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments.filter((c) =>
              c.body?.includes(marker),
            )) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

  build-and-push:
    needs: unlabel-and-clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: rdzpedraos/eventix:pr-${{ github.event.pull_request.number }}

  signal-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready for preview
        uses: actions/github-script@v8
        env:
          PREVIEW_LABEL: ${{ env.PREVIEW_LABEL }}
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [process.env.PREVIEW_LABEL],
            });
