name: Preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  contents: read
  statuses: write

env:
  PREVIEW_LABEL: preview-ready

jobs:
  unlabel-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reset PR state
        uses: actions/github-script@v8
        env:
          PREVIEW_LABEL: ${{ env.PREVIEW_LABEL }}
        with:
          script: |
            const pr = context.issue.number;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                name: process.env.PREVIEW_LABEL,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Delete Argo PR comments
        uses: ./.github/actions/delete-argo-pr-comments

  changes:
    runs-on: ubuntu-latest
    outputs:
      resources: ${{ steps.filter.outputs.resources }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            resources:
              - 'resources/**'

  javascript:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: needs.changes.outputs.resources != 'true'
        run: echo "Sin cambios en resources/; se omiten audit y lint de JS."

      - if: needs.changes.outputs.resources == 'true'
        uses: ./.github/actions/validate-javascript

  php:
    needs: javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Audit PHP dependencies (Composer)
        run: composer security:audit

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP (Pint)
        run: composer lint

      - name: Run unit tests (PHPUnit)
        run: composer test:unit

  build-and-push:
    needs: [unlabel-and-clean, javascript, php]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: rdzpedraos/eventix:${{ github.event.pull_request.head.sha }}

  signal-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready to generate preview
        uses: actions/github-script@v8
        env:
          PREVIEW_LABEL: ${{ env.PREVIEW_LABEL }}
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "pending",
              context: "argo/preview",
              description: "Despliegue de aplicación en construcción…",
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [process.env.PREVIEW_LABEL],
            });
