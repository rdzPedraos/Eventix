domain: eventix.k8s.test

image:
  repository: rdzpedraos/eventix
  tag: ""
  pullPolicy: IfNotPresent

nginx:
  image: nginx:1.27-alpine

replicaCount: 1

secrets:
  APP_KEY: ""

  DB_HOST: ""
  DB_PORT: "3306"
  DB_DATABASE: eventix
  DB_USERNAME: eventix
  DB_PASSWORD: ""

  MAIL_HOST: ""
  MAIL_PORT: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_ENCRYPTION: ""
  MAIL_FROM_ADDRESS: ""

configMap:
  APP_NAME: Eventix
  APP_ENV: production
  APP_DEBUG: "false"
  APP_TIMEZONE: UTC
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  MAIL_MAILER: log
  MAIL_FROM_NAME: Eventix
