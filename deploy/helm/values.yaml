domain: eventix.k8s.test

image:
  repository: rdzpedraos/eventix
  tag: ""
  pullPolicy: IfNotPresent

nginx:
  image: nginx:1.27-alpine

db:
  enabled: true
  image: mysql:8.0

redis:
  enabled: true
  image: redis:7-alpine

persistence: true

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  nginx:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  app:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  queue:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

queue:
  replicas: 1
  sleep: 3
  tries: 3
  maxTime: 3600

scheduler:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300

secrets:
  remote_secret_name: SECRETS-k8s

configMap:
  APP_NAME: Eventix
  APP_ENV: production
  APP_DEBUG: "false"
  APP_TIMEZONE: UTC
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US
  APP_MAINTENANCE_DRIVER: file

  BCRYPT_ROUNDS: "12"

  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: info

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"

  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"

  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local

  QUEUE_CONNECTION: database

  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  MAIL_MAILER: log
  MAIL_FROM_NAME: Eventix
