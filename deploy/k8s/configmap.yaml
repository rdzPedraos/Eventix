apiVersion: v1
kind: ConfigMap
metadata:
  name: eventix-app
data:
  APP_NAME: Eventix
  APP_ENV: production
  APP_DEBUG: "false"
  APP_TIMEZONE: UTC
  APP_URL: http://eventix.local

  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US

  APP_MAINTENANCE_DRIVER: file

  BCRYPT_ROUNDS: "12"

  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: info

  DB_CONNECTION: mysql

  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"

  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database

  CACHE_STORE: database

  MAIL_MAILER: log
  MAIL_FROM_NAME: ${APP_NAME}
