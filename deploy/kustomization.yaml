apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: eventix-nginx
    files:
      - nginx.conf=files/nginx.conf

secretGenerator:
  - name: eventix-envs
    envs:
      - files/.env

generatorOptions:
  disableNameSuffixHash: true

resources:
  - k8s/configmap.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/ingress.yaml
