apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rdzPedraos/Eventix.git
    targetRevision: main
    path: deploy/helm
    helm:
      releaseName: eventix
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: $ARGOCD_APP_REVISION
  destination:
    server: https://kubernetes.default.svc
    namespace: eventix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
