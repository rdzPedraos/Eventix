x-db-credentials: &db-credentials
  DB_HOST: svc-mysql
  DB_PORT: "3306"
  DB_DATABASE: &db_database eventix
  DB_USERNAME: &db_username test
  DB_PASSWORD: &db_password test

volumes:
  public:

services:
  svc-web:
    image: nginx:1.27-alpine
    ports:
      - "3200:3200"
    volumes:
      - ./deploy/helm/files/nginx.conf:/etc/nginx/nginx.conf:ro
      - public:/var/www/public:ro

  svc-app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    network_mode: "service:svc-web"
    volumes:
      - ./.env:/var/www/.env:ro
      - ./deploy/scripts/compose-init-db.sh:/init.sh:ro
      - ./deploy/helm/files/php.ini:/usr/local/etc/php/conf.d/z-custom.ini:ro
      - ./deploy/helm/files/php-fpm.conf:/usr/local/etc/php-fpm.d/z-www.conf:ro
      - public:/mnt/public
    env_file:
      - .env
    environment:
      <<: *db-credentials
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        cp -a /var/www/public/. /mnt/public/;
        sh /init.sh &&
        exec php-fpm -F
    depends_on:
      - svc-web
      - svc-mysql

  svc-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: *db_database
      MYSQL_USER: *db_username
      MYSQL_PASSWORD: *db_password
